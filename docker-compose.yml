services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-forge
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FORGE"
      VERSION: "26.2"
      FORGE_VERSION: "65.1.0"
      MEMORY: "8G"
      USE_AIKAR_FLAGS: "true"
      PACKWIZ_URL: "https://raw.githubusercontent.com/NikiTaysGO/sborik_2/main/packwiz/pack.toml"
    volumes:
      - ./data:/data
    stdin_open: true
    tty: true
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 10G
